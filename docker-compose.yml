services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  api:
    build: ./be
    env_file: ./be/.env
    environment:
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    ports: ["8000:8000"]
    depends_on:
      redis: { condition: service_healthy }

  worker:
    build: ./be
    command: ["node", "dist/src/worker.js"]
    env_file: ./be/.env
    environment:
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      redis: { condition: service_healthy }

  web:
    build:
      context: ./fe
      args:
        VITE_API_URL: http://localhost:8000/api
    ports: ["5173:80"]
    depends_on: [api]
